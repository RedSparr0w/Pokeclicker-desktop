<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'"
    >
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1"
    >
    <title>PokéClicker Setup</title>
    <link href="assets/images/favicon.ico" rel="icon" type="image/x-icon">
    <link href="setup.css" rel="stylesheet">
    <script src="setup.js" defer></script>
  </head>
  <body>
    <main class="setup-shell">
      <section class="setup-card" aria-live="polite">
        <img
          class="wordmark"
          src="assets/images/pokeclickerlogo.png"
          alt="PokéClicker"
        >
        <img
          class="pokeball"
          src="assets/images/pokeball/Pokeball.svg"
          alt=""
        >
        <h1 id="status">Preparing PokéClicker…</h1>
        <p id="detail">The game is downloaded once and remains available offline.</p>
        <div
          id="progress-track"
          class="progress-track indeterminate"
          role="progressbar"
          aria-label="Setup progress"
        >
          <span id="progress-bar" class="progress-bar"></span>
        </div>
      </section>
    </main>
  </body>
</html>
