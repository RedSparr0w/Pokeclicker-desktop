[package]
name = "pokeclicker-desktop"
version = "2.0.0"
description = "A lightweight, cross-platform desktop client for PokéClicker"
authors = ["RedSparr0w <desktop@pokeclicker.com>"]
repository = "https://github.com/RedSparr0w/Pokeclicker-desktop"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pokeclicker_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pokeclicker-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
discord-rich-presence = "=1.1.0"
futures-util = "=0.3.31"
log = "=0.4.28"
mime_guess = "=2.0.5"
open = "=5.3.2"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusty-leveldb = "=4.0.1"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-log = "=2.9.0"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
thiserror = "=2.0.16"
tempfile = "=3.21.0"
tokio = { version = "=1.47.1", features = ["fs", "io-util", "sync", "time"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
